<!DOCTYPE html>
<html>
<head>
    <title>My Website</title>

    <style>
        body {
            background-color: #f2f2f2;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        .box {
            background: white;
            width: 400px;
            margin: 100px auto;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px gray;
        }

        h1 {
            color: blue;
        }

        button {
            background: green;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: darkgreen;
        }
    </style>
</head>

<body>

    <div class="box">
        <h1>Welcome to My Website</h1>

        <p>I am learning HTML and CSS.</p>

        <button>Click Me</button>
    </div>

</body>
</html>
